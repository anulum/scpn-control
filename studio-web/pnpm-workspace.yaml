# Force the transitive undici onto the patched line: GHSA-hm92-r4w5-c3mj and
# GHSA-vmh5-mc38-953g (high), plus current request-smuggling/cache advisories,
# are fixed in 7.29.0.
# Force the transitive adm-zip (pulled in by @module-federation/third-party-dts-extractor)
# onto the patched line: GHSA-xcpc-8h2w-3j85 / CVE-2026-39244 (high, crafted-ZIP 4GB
# memory allocation) is fixed in 0.6.0.
overrides:
  undici: ">=7.29.0"
  jsdom>undici: ">=7.29.0 <8.0.0"
  "@module-federation/dts-plugin>undici": ">=8.9.0"
  adm-zip: ">=0.6.0"
  brace-expansion: "5.0.9"
  # Force transitive postcss (via vite) onto security-fixed line:
  # Dependabot: lowest fixed 8.5.18; pin current patched 8.5.23.
  postcss: ">=8.5.18"
  nanoid: "3.3.18"
  # Dependabot cannot update this transitive package without a root override.
  # Security update requires >=4.28.7; pin the current fixed release.
  browserslist: 4.28.8

minimumReleaseAgeExclude:
  - 'undici@8.9.0'
  - 'brace-expansion@5.0.9'
  - 'nanoid@3.3.18'
  - '@module-federation/vite@1.16.10'
  - '@typescript-eslint/eslint-plugin@8.62.0'
  - '@typescript-eslint/parser@8.62.0'
  - '@typescript-eslint/project-service@8.62.0'
  - '@typescript-eslint/scope-manager@8.62.0'
  - '@typescript-eslint/tsconfig-utils@8.62.0'
  - '@typescript-eslint/type-utils@8.62.0'
  - '@typescript-eslint/types@8.62.0'
  - '@typescript-eslint/typescript-estree@8.62.0'
  - '@typescript-eslint/utils@8.62.0'
  - '@typescript-eslint/visitor-keys@8.62.0'
  - typescript-eslint@8.62.0
  - postcss@8.5.23
