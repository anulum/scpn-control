# SCPN Control — Pnpm workspace.

# Force the transitive undici onto the patched line of the major each consumer
# declares: jsdom 30.1 requires ^8.10.2 and @module-federation/dts-plugin 2.9
# pins 7.29.0. GHSA-hm92-r4w5-c3mj and GHSA-vmh5-mc38-953g (high) were fixed in
# 7.29.0; GHSA-w293-vg96-wgc3 and GHSA-vp8m-p9jh-q5pm (high),
# GHSA-pmjh-fq2x-6v4x, GHSA-2jfj-6hjv-fm6j, GHSA-r53p-7pc4-xj5r,
# GHSA-2gqq-gqf2-x968 and GHSA-8436-99hf-9mmv are fixed in 7.29.1 and 8.10.2.
# Force typedoc's markdown-it (^14.3.0) onto the patched line:
# GHSA-253c-mchw-3w2r is fixed in 14.3.1.
# Force the transitive adm-zip (pulled in by @module-federation/third-party-dts-extractor)
# onto the patched line: GHSA-xcpc-8h2w-3j85 / CVE-2026-39244 (high, crafted-ZIP 4GB
# memory allocation) is fixed in 0.6.0.
overrides:
  undici: ">=7.29.1"
  jsdom>undici: ">=8.10.2 <9.0.0"
  "@module-federation/dts-plugin>undici": ">=7.29.1 <8.0.0"
  markdown-it: ">=14.3.1 <15.0.0"
  adm-zip: ">=0.6.0"
  brace-expansion: "5.0.9"
  # Require the patched PostCSS line for transitive users; the direct
  # development dependency has its own exact pin in package.json.
  postcss: ">=8.5.18"
  nanoid: "3.3.18"
  # Dependabot cannot update this transitive package without a root override.
  # Security update requires >=4.28.7; pin the current fixed release.
  browserslist: 4.28.8

minimumReleaseAgeExclude:
  - 'undici@8.9.0'
  - 'brace-expansion@5.0.9'
  - 'nanoid@3.3.18'
  - '@module-federation/vite@1.16.10'
  - '@typescript-eslint/eslint-plugin@8.62.0'
  - '@typescript-eslint/parser@8.62.0'
  - '@typescript-eslint/project-service@8.62.0'
  - '@typescript-eslint/scope-manager@8.62.0'
  - '@typescript-eslint/tsconfig-utils@8.62.0'
  - '@typescript-eslint/type-utils@8.62.0'
  - '@typescript-eslint/types@8.62.0'
  - '@typescript-eslint/typescript-estree@8.62.0'
  - '@typescript-eslint/utils@8.62.0'
  - '@typescript-eslint/visitor-keys@8.62.0'
  - typescript-eslint@8.62.0
  - postcss@8.5.23
