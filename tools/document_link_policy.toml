# SCPN Control — Deterministic public-document link policy.

[scan]
include_suffixes = [".md", ".markdown", ".html", ".htm", ".tex", ".bib", ".json", ".toml", ".yaml", ".yml", ".cff"]
exclude_prefixes = [".coordination/", "04_ARCANE_SAPIENCE/", "docs/internal/", "site/"]
exclude_globs = ["papers/*.aux", "papers/*.bbl", "papers/*.blg", "papers/*.out"]

[local]
require_tracked_targets = true
check_markdown_anchors = true

[external]
allowed_schemes = ["https", "http"]
timeout_seconds = 12.0
retries = 2
retry_backoff_seconds = 1.0
per_host_delay_seconds = 0.20
cache_ttl_seconds = 604800
transient_cache_ttl_seconds = 21600
max_urls = 600
user_agent = "SCPN-CONTROL-document-link-audit/1.0 (+https://github.com/anulum/scpn-control)"
transient_statuses = [408, 425, 429, 500, 502, 503, 504]
restricted_statuses = [401, 403]
permanent_statuses = [404, 410]
secret_query_keys = ["access_token", "api_key", "apikey", "auth", "authorization", "key", "password", "secret", "sig", "signature", "token"]

# These schemes identify citations or local contact actions, not crawl targets.
ignored_schemes = ["doi", "mailto", "tel"]
