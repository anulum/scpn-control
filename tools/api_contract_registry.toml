# SCPN Control — Api contract registry.

schema = "scpn-control.api-contract-registry.v1"

[policy]
stable_python_surface = "Only names in scpn_control.__all__ are package-stable; module reference visibility alone is not a compatibility promise."
python_semantics = "NumPy docstrings plus strict type signatures define parameters, returns, raises, state mutation, units/shapes, safety boundaries, compatibility, evidence and examples when applicable. Empty headings are forbidden by the documentation quality gate."
rust_semantics = "Public crate owners require rustdoc under -D warnings -D missing_docs; Rust types and Result values carry parameter, return and error contracts."
typescript_semantics = "Studio exports require TypeDoc with requiredToBeDocumented and TypeScript strict mode."
operator_semantics = "Shell entrypoints and GitHub workflows are operator contracts, not library APIs; ShellCheck/actionlint and pinned-action gates own them."

