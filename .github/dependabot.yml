# SCPN Control — Dependabot.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github_actions"
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    # The locks are hash-checked pip-compile outputs chained through
    # `-c ci-deps.txt` and similar constraints. Dependabot's relock cannot
    # resolve that chain: every release of a pinned constraint (click 8.5.1,
    # pydantic) fails the whole weekly job, as do gymnasium 1.3+ against
    # stable-baselines3 2.8.0 and the PyTorch `+cpu` wheels. Its PRs also
    # dropped the --allow-unsafe setuptools pin (#295–#297).
    # Keep alerts, but relock in the canonical checkout with each lock's own
    # command. The limit stops version PRs; the wildcard also blocks
    # security-update PRs. Locked python-audit still gates CI.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "cargo"
    directory: "/scpn-control-rs"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(rust)"
    ignore:
      - dependency-name: "ndarray"
        versions:
          - ">= 0.17.0"
      - dependency-name: "rand"
        versions:
          - ">= 0.9.0"
      - dependency-name: "rand_distr"
        versions:
          - ">= 0.5.0"
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "npm"
    directory: "/studio-web"
    schedule:
      interval: "weekly"
    # pnpm regenerates pnpm-lock.yaml without the mandatory seven-line header.
    # Keep vulnerability alerts, but refresh this graph in the canonical checkout.
    # The limit stops version PRs; the wildcard also blocks security-update PRs.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
    rebase-strategy: "disabled"
    commit-message:
      prefix: "deps(studio-web)"
    labels:
      - "dependencies"
      - "javascript"
