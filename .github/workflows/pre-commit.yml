# SCPN Control — Pre commit GitHub Actions workflow.

name: Pre-commit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    # The qualified native tools below are pinned for Ubuntu 24.04, as in
    # the static-governance pre-commit job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The changed-source hooks compare against the origin revision that
          # tools/docstring_debt_ceiling.json records; a shallow clone lacks it.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Install pre-commit and system hook tools
        run: |
          pip install --require-hashes -r requirements/ci-precommit.txt
          pip install --require-hashes -r requirements/ci-lint.txt
      - name: Install the typing environment of the strict mypy lane
        # changed-python-static runs strict mypy on every changed Python file,
        # so it needs the packages those files import, as the python-tests
        # mypy lane installs them.
        run: |
          pip install --require-hashes -r requirements/ci-deps.txt
          pip install --require-hashes -r requirements/ci-test.txt
          pip install --require-hashes -r requirements/ci-mast.txt
          pip install --require-hashes -r requirements/ci-viz.txt
          pip install --require-hashes --no-build-isolation -r requirements/ci-neuro.txt
          pip install --require-hashes -r requirements/ci-rl.txt
          pip install --require-hashes -r requirements/ci-studio.txt
          pip install --require-hashes -r requirements/ci-imas.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22.23.2"
      - name: Install the qualified Studio dependency graph
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --dir studio-web install --frozen-lockfile
      - name: Install the qualified Rust syntax parser
        run: rustup toolchain install nightly-2026-08-21 --profile minimal --no-self-update
      - name: Acquire frozen native Rust dependency graphs
        run: |
          cargo +1.98.0 fetch --manifest-path scpn-control-rs/Cargo.toml --locked
          cargo +1.98.0 fetch --manifest-path scpn-control-rs/fuzz/Cargo.toml --locked
      - name: Install qualified native source tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck=0.9.0-1 shfmt=3.8.0-1 \
            clang-18=1:18.1.3-1ubuntu1 clang-format-18=1:18.1.3-1ubuntu1 gcc-13 g++-13

      - name: Run pre-commit
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: pre-commit run --all-files --show-diff-on-failure
