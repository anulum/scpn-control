# SCPN Control — Docs pages GitHub Actions workflow.

name: Docs Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/scpn_control/**"
      - "mkdocs.yml"
      - "README.md"
      - "tools/check_docs_coverage.py"
      - "tools/document_link_audit.py"
      - "tools/document_link_policy.toml"
      - ".github/workflows/docs-pages.yml"
      - "examples/*.ipynb"
      - "studio-web/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.1
        with:
          node-version: "22"

      - name: Build Studio remote for Pages
        working-directory: studio-web
        env:
          SCPN_STUDIO_BASE_PATH: /scpn-control/studios/scpn-control/
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install docs dependencies
        run: pip install --require-hashes -r requirements/ci-docs.txt

      - name: Check documentation coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python tools/check_docs_coverage.py

      - name: Check deterministic source links
        run: python tools/document_link_audit.py

      - name: Build docs
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: mkdocs build --strict

      - name: Install Studio remote in Pages artifact
        run: |
          test -f studio-web/dist/remoteEntry.js
          test -f studio-web/dist/manifest.json
          test -f studio-web/dist/studio-feed.json
          install -d site/studios/scpn-control
          cp -a studio-web/dist/. site/studios/scpn-control/

      - name: Check rendered site links
        run: python tools/document_link_audit.py --site-dir site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
