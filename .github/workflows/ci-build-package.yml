# SCPN Control — CI Build and Package.

name: CI / Build and Package

on:
  workflow_call:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  # ─── Job 3: Package quality gate ───
  package-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: pip install --require-hashes -r requirements/ci-build.txt
      - name: Build package
        run: |
          python tools/build_release_artifacts.py --outdir dist-a
          python tools/build_release_artifacts.py --outdir dist-b
          cmp dist-a/scpn_control-*.whl dist-b/scpn_control-*.whl
          cmp dist-a/scpn_control-*.tar.gz dist-b/scpn_control-*.tar.gz
          mv dist-a dist
      - name: Validate package metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: python-dist
          path: dist/
