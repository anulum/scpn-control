# SCPN Control — CI Static Analysis and Governance.

name: CI / Static Analysis and Governance

on:
  workflow_call:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  # ─── Job 4c: Capability manifest gate ───
  capability-manifest-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Install workflow policy dependencies
        run: pip install --require-hashes -r requirements/ci-lint.txt
      - name: Validate capability manifest
        run: |
          python tools/capability_manifest.py --check
          python tools/check_studio_deploy_key.py
          python tools/check_studio_offline_sealing.py
          python tools/sync_studio_web_manifest.py --check
          python tools/public_claim_ledger.py --check
          python tools/check_rust_toolchain_contract.py

  # ─── Job 11: Python lint (ruff) ───
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Install lint and policy dependencies
        run: pip install --require-hashes -r requirements/ci-lint.txt
      - name: Ruff check
        run: ruff check src/scpn_control/
      - name: Ruff check (test, tool and validation surfaces)
        run: ruff check --extend-ignore D tests/ tools/ validation/
      - name: Ruff format check
        run: ruff format --check src/scpn_control/ tests/ tools/ validation/
      - name: Scalar benchmark native docs and lint
        run: |
          ruff check validation/control_benchmark_suite.py tests/test_control_benchmark_suite.py
          ruff format --check validation/control_benchmark_suite.py
      - name: Docstring debt ratchet
        run: python tools/check_docstring_debt.py
      - name: Python lint scope contract
        run: python tools/check_python_lint_contract.py
      - name: Changelog mirror sync
        run: python tools/check_changelog_sync.py
      - name: Tracked source-header policy
        run: python tools/check_source_headers.py
      - name: Competitive evidence contract
        run: python tools/check_competitive_evidence.py
      - name: Documentation coverage
        run: python tools/check_docs_coverage.py
      - name: Public-API docstring coverage
        run: python tools/run_docstring_gate.py
      - name: Coverage exception ownership ledger
        run: python tools/coverage_exception_ledger.py --check
      - name: Cross-language API contract inventory
        run: python tools/check_api_contracts.py
      - name: Native C and Lean API reference freshness
        run: python tools/generate_native_api_reference.py --check
      - name: JOSS submission guard
        run: python tools/check_joss_submission.py
      - name: Public surface hygiene
        run: python tools/check_public_surface_hygiene.py
      - name: CI workflow modularity
        run: python tools/check_ci_workflow_modularity.py
      - name: docs/internal forever private
        run: python tools/check_docs_internal_private.py

  # ─── Job 13: Pre-commit hooks ───
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # 1.98.0
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --require-hashes -r requirements/ci-precommit.txt
          pip install --require-hashes -r requirements/ci-lint.txt
          pip install --require-hashes -r requirements/ci-deps.txt
          pip install --require-hashes -r requirements/ci-test.txt
      - name: Test real hook contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pre_commit --version
          python -m pytest tests/test_python_lint_contract.py -v --tb=short
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22.23.2"
      - name: Install the qualified Studio dependency graph
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --dir studio-web install --frozen-lockfile
      - name: Install qualified shell parsers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck=0.9.0-1 shfmt=3.8.0-1
      - name: Test native source contracts
        env:
          SCPN_STUDIO_SOURCE_COVERAGE_RC: ${{ runner.temp }}/native-source.coveragerc
          SCPN_SHELL_SOURCE_COVERAGE_RC: ${{ runner.temp }}/native-source.coveragerc
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          project = Path(os.environ.get('GITHUB_WORKSPACE', '.')).resolve()
          outputs = Path('artifacts/coverage/native-tools')
          outputs.mkdir(parents=True, exist_ok=True)
          names = ['tools/studio_source_checks.py', 'tools/shell_source_checks.py']
          (outputs / 'source_manifest.json').write_text(json.dumps({
              name: hashlib.sha256((project / name).read_bytes()).hexdigest() for name in names
          }))
          Path(os.environ['SCPN_STUDIO_SOURCE_COVERAGE_RC']).write_text(
              '[run]\nbranch = True\n'
              'data_file = artifacts/coverage/native-tools/.coverage\n'
              'include = */tools/studio_source_checks.py,*/tools/shell_source_checks.py\n'
              '[report]\nexclude_lines =\nfail_under = 100\n'
          )
          PY
          python -m coverage run --parallel-mode --rcfile "$SCPN_STUDIO_SOURCE_COVERAGE_RC" \
            -m pytest native_tests/ -q
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import coverage
          project = Path(os.environ.get('GITHUB_WORKSPACE', '.')).resolve()
          cov = coverage.Coverage(config_file=os.environ['SCPN_STUDIO_SOURCE_COVERAGE_RC'])
          cov.combine(keep=True)
          cov.save()
          expected = {project / name for name in ['tools/studio_source_checks.py', 'tools/shell_source_checks.py']}
          observed = {Path(name).resolve() for name in cov.get_data().measured_files()}
          if observed != expected:
              raise SystemExit('Native coverage scope differs from the required complete files')
          manifest = json.loads(Path('artifacts/coverage/native-tools/source_manifest.json').read_text())
          if set(manifest) != {str(path.relative_to(project)) for path in expected}:
              raise SystemExit('Native source manifest differs from the required complete files')
          if any(hashlib.sha256((project / name).read_bytes()).hexdigest() != digest for name, digest in manifest.items()):
              raise SystemExit('Native source changed after measurement')
          total = cov.report(show_missing=True)
          raise SystemExit(0 if total == 100 else 1)
          PY
      - name: Retain native source-tool coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: source-native-static-coverage
          path: artifacts/coverage/native-tools/
          include-hidden-files: true
      - name: Run pre-commit
        run: pre-commit run --all-files

  # ─── Job 20: Commit authorship gate ───
  # Backstop for the local commit-msg hook: verifies that every new
  # non-merge commit in the pushed or pull-request range carries the
  # canonical authorship line and no legacy Co-Authored-By trailer, so a
  # commit made with --no-verify cannot bypass the policy silently.
  commit-authorship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Verify commit authorship lines
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          start="${PR_BASE:-$PUSH_BEFORE}"
          zero="0000000000000000000000000000000000000000"
          if [ -z "$start" ] || [ "$start" = "$zero" ] || ! git cat-file -e "${start}^{commit}" 2>/dev/null; then
            echo "No usable base ref ('${start}'); skipping authorship range check."
            exit 0
          fi
          shas="$(git rev-list --no-merges "${start}..${HEAD_SHA}")"
          if [ -z "$shas" ]; then
            echo "No new non-merge commits to verify."
            exit 0
          fi
          workdir="$(mktemp -d)"
          message_files=()
          for sha in $shas; do
            author_email="$(git log -1 --format=%ae "$sha")"
            if [ "$author_email" = "49699333+dependabot[bot]@users.noreply.github.com" ]; then
              echo "Skipping trusted Dependabot commit ${sha}."
              continue
            fi
            message_file="${workdir}/${sha}.txt"
            git log -1 --format=%B "$sha" > "$message_file"
            message_files+=("$message_file")
          done
          if [ "${#message_files[@]}" -eq 0 ]; then
            echo "No human-authored commits to verify."
            exit 0
          fi
          python tools/check_commit_authorship.py "${message_files[@]}"
