# SCPN Control — CI Static Analysis and Governance.

name: CI / Static Analysis and Governance

on:
  workflow_call:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  # ─── Job 4c: Capability manifest gate ───
  capability-manifest-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Validate capability manifest
        run: |
          python tools/capability_manifest.py --check
          python tools/check_studio_deploy_key.py
          python tools/check_studio_offline_sealing.py
          python tools/sync_studio_web_manifest.py --check
          python tools/public_claim_ledger.py --check
          python tools/check_rust_toolchain_contract.py

  # ─── Job 11: Python lint (ruff) ───
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Install lint and policy dependencies
        run: pip install --require-hashes -r requirements/ci-lint.txt
      - name: Ruff check
        run: ruff check src/scpn_control/
      - name: Ruff format check
        run: ruff format --check src/scpn_control/ tests/
      - name: Python lint scope contract
        run: python tools/check_python_lint_contract.py
      - name: Changelog mirror sync
        run: python tools/check_changelog_sync.py
      - name: Tracked source-header policy
        run: python tools/check_source_headers.py
      - name: Competitive evidence contract
        run: python tools/check_competitive_evidence.py
      - name: Documentation coverage
        run: python tools/check_docs_coverage.py
      - name: Public-API docstring coverage
        run: python tools/run_docstring_gate.py
      - name: Coverage exception ownership ledger
        run: python tools/coverage_exception_ledger.py --check
      - name: Cross-language API contract inventory
        run: python tools/check_api_contracts.py
      - name: Native C and Lean API reference freshness
        run: python tools/generate_native_api_reference.py --check
      - name: JOSS submission guard
        run: python tools/check_joss_submission.py
      - name: Public surface hygiene
        run: python tools/check_public_surface_hygiene.py
      - name: CI workflow modularity
        run: python tools/check_ci_workflow_modularity.py
      - name: docs/internal forever private
        run: python tools/check_docs_internal_private.py

  # ─── Job 13: Pre-commit hooks ───
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # 1.98.0
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --require-hashes -r requirements/ci-precommit.txt
      - name: Run pre-commit
        run: pre-commit run --all-files

  # ─── Job 20: Commit authorship gate ───
  # Backstop for the local commit-msg hook: verifies that every new
  # non-merge commit in the pushed or pull-request range carries the
  # canonical authorship line and no legacy Co-Authored-By trailer, so a
  # commit made with --no-verify cannot bypass the policy silently.
  commit-authorship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Verify commit authorship lines
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          start="${PR_BASE:-$PUSH_BEFORE}"
          zero="0000000000000000000000000000000000000000"
          if [ -z "$start" ] || [ "$start" = "$zero" ] || ! git cat-file -e "${start}^{commit}" 2>/dev/null; then
            echo "No usable base ref ('${start}'); skipping authorship range check."
            exit 0
          fi
          shas="$(git rev-list --no-merges "${start}..${HEAD_SHA}")"
          if [ -z "$shas" ]; then
            echo "No new non-merge commits to verify."
            exit 0
          fi
          workdir="$(mktemp -d)"
          message_files=()
          for sha in $shas; do
            author_email="$(git log -1 --format=%ae "$sha")"
            if [ "$author_email" = "49699333+dependabot[bot]@users.noreply.github.com" ]; then
              echo "Skipping trusted Dependabot commit ${sha}."
              continue
            fi
            message_file="${workdir}/${sha}.txt"
            git log -1 --format=%B "$sha" > "$message_file"
            message_files+=("$message_file")
          done
          if [ "${#message_files[@]}" -eq 0 ]; then
            echo "No human-authored commits to verify."
            exit 0
          fi
          python tools/check_commit_authorship.py "${message_files[@]}"
