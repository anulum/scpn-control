# SCPN Control — CI Rust Benchmark Evidence.

name: CI / Rust Benchmark Evidence

on:
  workflow_call:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  # ─── Job 8: Rust benchmarks ───
  rust-benchmarks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scpn-control-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # 1.98.0
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Bench
        run: cargo bench --workspace --exclude scpn-control-rs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: bench-results
          path: scpn-control-rs/target/criterion/
