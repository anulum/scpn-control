# SCPN Control — Docs link audit GitHub Actions workflow.

name: Docs Link Audit

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-link-audit
  cancel-in-progress: false

jobs:
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Restore external-link result cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/document-links.json
          key: docs-link-audit-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            docs-link-audit-${{ runner.os }}-

      - name: Audit public external links
        run: |
          mkdir -p .cache artifacts
          python tools/document_link_audit.py \
            --external \
            --cache .cache/document-links.json \
            --json-out artifacts/document_link_audit.json

      - name: Upload governed link report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: document-link-audit
          path: artifacts/document_link_audit.json
          if-no-files-found: error
