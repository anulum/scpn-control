# SCPN Control — CI coordinator and stable aggregate gate.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-governance:
    uses: ./.github/workflows/ci-static-governance.yml

  python-quality:
    uses: ./.github/workflows/ci-python-quality.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-package:
    uses: ./.github/workflows/ci-build-package.yml

  native-polyglot:
    uses: ./.github/workflows/ci-native-polyglot.yml

  native-coverage:
    needs: [python-quality, native-polyglot]
    uses: ./.github/workflows/ci-native-coverage.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  evidence-reproducibility:
    uses: ./.github/workflows/ci-evidence-reproducibility.yml

  python-benchmark:
    needs: python-quality
    uses: ./.github/workflows/ci-python-benchmark.yml

  rust-benchmark:
    uses: ./.github/workflows/ci-rust-benchmark.yml

  security-supply-chain:
    uses: ./.github/workflows/ci-security-supply-chain.yml

  product-deployment:
    uses: ./.github/workflows/ci-product-deployment.yml
    secrets:
      SCPN_CONTROL_STUDIO_DEPLOY_KEY: ${{ secrets.SCPN_CONTROL_STUDIO_DEPLOY_KEY }}
      SCPN_CONTROL_STUDIO_KNOWN_HOSTS: ${{ secrets.SCPN_CONTROL_STUDIO_KNOWN_HOSTS }}

  ci-gate:
    needs:
      - static-governance
      - python-quality
      - build-package
      - native-polyglot
      - native-coverage
      - evidence-reproducibility
      - python-benchmark
      - rust-benchmark
      - security-supply-chain
      - product-deployment
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require every CI responsibility to pass
        env:
          CATEGORY_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          results = json.loads(os.environ["CATEGORY_RESULTS"])
          failures = {
              name: value["result"]
              for name, value in results.items()
              if value["result"] != "success"
          }
          if failures:
              raise SystemExit(f"CI category gate failed: {failures}")
          print("CI category gate passed")
          PY
